name = "bananachess"
main = "server/index.ts"
compatibility_date = "2025-09-01"

# The built site. One Worker serves both it and the match rooms, so there is one origin
# and no CORS to arrange.
[assets]
directory = "dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[durable_objects.bindings]]
name = "MATCH_ROOM"
class_name = "MatchRoomObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MatchRoomObject"]
