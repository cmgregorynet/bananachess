name: Android

# Builds, tests and lints the Android app. Nothing is deployed and no secrets are read.
on:
  push:
    branches: [main]
    # The engine tests replay Web/fixtures/conformance.json.gz, so a new fixture must
    # re-run them even when no Android file changed.
    paths: ["Android/**", "Web/fixtures/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["Android/**", "Web/fixtures/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: Android

jobs:
  check:
    name: Build, tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      # The same four packages as Android/README.md. Lint reads android-37.0; the app
      # compiles against android-37.2.
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-37.0 platforms;android-37.2 build-tools;37.0.0"
      # The basic provider is the open-source one built on actions/cache. It is free for
      # private repositories; the default provider is only a free preview there.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - run: ./gradlew :engine:test :app:testDebugUnitTest :app:lintDebug ktlintCheck :app:assembleDebug
      # Paths here are relative to the repository root, not to the working directory.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: android-reports
          path: |
            Android/*/build/reports/
            Android/*/build/test-results/
            Android/build/reports/
          if-no-files-found: ignore
          retention-days: 14
