# Up to five worktrees may build at once and share one Gradle home, so keep each daemon modest.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# AGP 9 makes unit tests for the debug build type only. The release build type gets them too, so
# :app:testReleaseUnitTest runs the suite against the release variant.
android.onlyEnableUnitTestForTheTestedBuildType=false
